name: QA-Genius Cloud Playwright Runner

on:
  repository_dispatch:
    types: [trigger-playwright-test]

permissions:
  contents: read
  actions: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Caches ~/.npm so npm ci resolves packages from local cache
          cache: npm

      # ── Cache node_modules directly ─────────────────────────────────────────
      # This skips the unpack/link phase of `npm ci` on cache hit, saving ~60-90s.
      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # ── Cache Playwright browser binaries ───────────────────────────────────
      # Chromium binaries are ~130 MB; downloading them on every run costs ~30s.
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-chromium-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # When the browser binary cache hit, we still need OS-level deps
      # (libglib, libnss, etc.) but NOT the heavy browser download.
      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # ── Materialize the test file from the dispatch payload ─────────────────
      - name: Materialize cloud test file
        env:
          RELATIVE_PATH: ${{ github.event.client_payload.relative_path }}
          TEST_CODE_B64: ${{ github.event.client_payload.test_code_b64 }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const rel = process.env.RELATIVE_PATH;
          const b64 = process.env.TEST_CODE_B64;
          if (!rel || !b64) {
            console.error("Missing relative_path or test_code_b64 in client_payload");
            process.exit(1);
          }
          if (rel.includes("..")) {
            console.error("Invalid relative_path");
            process.exit(1);
          }
          const code = Buffer.from(b64, "base64").toString("utf8");
          const target = path.join("tests", "generated", rel);
          fs.mkdirSync(path.dirname(target), { recursive: true });
          fs.writeFileSync(target, code, "utf8");
          console.log(`Wrote cloud test: ${target} (${code.length} bytes)`);
          NODE

      # ── Run only the dispatched test file ───────────────────────────────────
      # --workers=1      : single Chromium process — no overhead of worker spawning
      # --headed=false   : explicit headless mode (default in CI, but set for clarity)
      # --reporter=list  : compact stdout reporter; html for the artifact
      - name: Run Playwright test
        id: playwright
        env:
          BASE_URL: ${{ github.event.client_payload.base_url || 'https://example.com' }}
          CI: "true"
          # CI=true causes Playwright to run headless automatically — no --headed flag needed
        run: |
          TEST_PATH="tests/generated/${{ github.event.client_payload.relative_path }}"
          echo "Running: npx playwright test ${TEST_PATH}"
          npx playwright test "${TEST_PATH}" \
            --config=playwright.config.ts \
            --reporter=list,html \
            --workers=1

      # ── Upload failure artifacts ─────────────────────────────────────────────
      # always() ensures this step runs even when the test step exits with code 1.
      # if-no-files-found: ignore makes it a safe no-op when tests pass (no test-results/).
      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
